{{ define "main" }}
<section class="list-section">
  <header class="list-header">
    <h1 class="list-title">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="list-content">
      {{ . }}
    </div>
    {{ end }}
  </header>
  <div class="list-items">
    {{ range .Pages }}
    <article class="post-item">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
