{{- with .Params.tags -}}
<nav class="post-tags" aria-label="{{ i18n "aria_tags" }}">
  <span class="tags-label">{{ i18n "tags_label" }}</span>
  <ul class="tags-list">
    {{- range . -}}
      {{- $tagPage := site.GetPage (printf "/tags/%s" (. | urlize)) -}}
      <li class="tags-item">
        <a href="{{ with $tagPage }}{{ .RelPermalink }}{{ else }}{{ printf "/tags/%s/" (. | urlize) | relURL }}{{ end }}">
          {{- with $tagPage }}{{ .Title }}{{ else }}{{ . }}{{ end -}}
        </a>
      </li>
    {{- end -}}
  </ul>
</nav>
{{- end -}}
