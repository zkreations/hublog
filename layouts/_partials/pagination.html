{{- $paginator := .Paginator -}}
{{- if gt $paginator.TotalPages 1 -}}
<nav class="pagination" aria-label="Pagination">
  {{- if $paginator.HasPrev -}}
    <a class="pagination-link pagination-prev" href="{{ $paginator.Prev.URL }}" rel="prev"><span aria-hidden="true">&larr;</span> Previous</a>
  {{- else -}}
    <span class="pagination-link pagination-disabled" aria-hidden="true">&larr; Previous</span>
  {{- end -}}

  <span class="pagination-info">Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}</span>

  {{- if $paginator.HasNext -}}
    <a class="pagination-link pagination-next" href="{{ $paginator.Next.URL }}" rel="next">Next <span aria-hidden="true">&rarr;</span></a>
  {{- else -}}
    <span class="pagination-link pagination-disabled" aria-hidden="true">Next &rarr;</span>
  {{- end -}}
</nav>
{{- end -}}
